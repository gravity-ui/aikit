name: Release

on:
  push:
    branches:
      - main
      - release/v2

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check release line before publishing
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: node scripts/release/check-major.cjs
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GRAVITY_UI_APP_ID }}
          private-key: ${{ secrets.GRAVITY_UI_APP_PRIVATE_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - uses: codex-team/action-nodejs-package-info@v1
        id: package
      - name: Create GitHub release draft
        id: release
        uses: google-github-actions/release-please-action@v3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          release-type: node
          package-name: ${{ steps.package.outputs.name }}
          default-branch: ${{ github.ref_name }}
          bump-minor-pre-major: true
          command: github-release
          draft: true
          changelog-types: >
            [{"type":"feat","section":"Features","hidden":false},
            {"type":"fix","section":"Bug Fixes","hidden":false},
            {"type":"perf","section":"Performance Improvements","hidden":false}]
      - name: Publish GitHub release with explicit Latest policy
        if: steps.release.outputs.release_created == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const publishRelease = require('./scripts/release/publish-github-release.cjs');
            await publishRelease({
              github, repo: context.repo, branch: context.ref.replace('refs/heads/', ''),
              releaseId: Number(process.env.RELEASE_ID), version: require('./package.json').version,
            });
      - name: Publish npm package
        if: steps.release.outputs.release_created == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GRAVITY_UI_BOT_NPM_TOKEN }}
          NPM_DIST_TAG: ${{ github.ref_name == 'main' && 'latest' || 'release-v2' }}
        run: npm publish --tag "$NPM_DIST_TAG" --access public
      - name: Prepare next release PR after publication
        uses: google-github-actions/release-please-action@v3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          release-type: node
          package-name: ${{ steps.package.outputs.name }}
          default-branch: ${{ github.ref_name }}
          bump-minor-pre-major: true
          command: release-pr
          changelog-types: >
            [{"type":"feat","section":"Features","hidden":false},
            {"type":"fix","section":"Bug Fixes","hidden":false},
            {"type":"perf","section":"Performance Improvements","hidden":false}]
      - name: Enable release PR auto-merge
        if: vars.RELEASE_AUTOMERGE == 'true' && vars.RELEASE_BOT_LOGIN != ''
        uses: actions/github-script@v7
        env:
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', base: context.ref.replace('refs/heads/', ''),
            });
            for (const pr of prs) {
              if (pr.user.login !== process.env.RELEASE_BOT_LOGIN ||
                  pr.head.repo.full_name !== context.payload.repository.full_name ||
                  !pr.head.ref.startsWith('release-please--') ||
                  !pr.labels.some(label => label.name === 'autorelease: pending') ||
                  pr.draft || pr.auto_merge) continue;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: pr.number,
              });
              const allowed = new Set(['package.json', 'package-lock.json', 'CHANGELOG.md']);
              if (!files.length || files.some(file => !allowed.has(file.filename))) {
                core.warning(`Release PR #${pr.number} changes unexpected files; review manually.`);
                continue;
              }
              await github.graphql(`mutation($id: ID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                  pullRequest { number }
                }
              }`, {id: pr.node_id});
            }
