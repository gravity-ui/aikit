name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  verify_files:
    name: Verify Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Packages
        run: npm ci
      - name: Check Generated Mascot Assets
        run: npm run generate:mascot:check
      - name: Lint Files
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  tests:
    name: Tests (UIKit ${{ matrix.uikit }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        uikit: [locked, '8.0.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Packages
        run: npm ci
      - name: Install minimum supported UIKit
        if: matrix.uikit != 'locked'
        run: npm install --no-save --ignore-scripts @gravity-ui/uikit@${{ matrix.uikit }}
      - name: Verify dependency manifests are unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Verify UIKit dependency tree
        run: npm ls @gravity-ui/uikit
      - name: Check minimum UIKit types and build
        if: matrix.uikit != 'locked'
        run: |
          npm run typecheck
          npm run build
      - name: Unit Tests
        run: npm run test:unit

  tests_result:
    name: Tests
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$TEST_RESULT" = success
