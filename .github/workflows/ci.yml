name: CI

on:
  push:
    branches: [main, release/v2]
  pull_request:
    branches: [main, release/v2]
  merge_group:

jobs:
  release_major:
    name: Release Major
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test release policy
        run: node --test scripts/release/*.test.cjs
      - name: Check release line
        env:
          RELEASE_BRANCH: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref_name }}
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          export RELEASE_BRANCH="${RELEASE_BRANCH#refs/heads/}"
          if [[ -n "$RELEASE_BASE_SHA" && ! "$RELEASE_BASE_SHA" =~ ^0+$ ]]; then
            RELEASE_BASE_VERSION=$(git show "$RELEASE_BASE_SHA:package.json" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
            export RELEASE_BASE_VERSION
          fi
          node scripts/release/check-major.cjs

  verify_files:
    name: Verify Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Packages
        run: npm ci
      - name: Check public API boundaries
        run: npm run generate:exports:check
      - name: Check Generated Mascot Assets
        run: npm run generate:mascot:check
      - name: Check release script formatting
        run: npx --no-install prettier --check scripts/release/*.cjs
      - name: Lint Files
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  tests:
    name: Tests (UIKit ${{ matrix.uikit }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        uikit: [locked, '8.0.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Packages
        run: npm ci
      - name: Install minimum supported UIKit
        if: matrix.uikit != 'locked'
        run: npm install --no-save --ignore-scripts @gravity-ui/uikit@${{ matrix.uikit }}
      - name: Verify dependency manifests are unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Verify UIKit dependency tree
        run: npm ls @gravity-ui/uikit
      - name: Check minimum UIKit types
        if: matrix.uikit != 'locked'
        run: npm run typecheck
      - name: Unit Tests
        run: npm test
      - name: Build package
        run: npm run build

  tests_result:
    name: Tests
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$TEST_RESULT" = success
